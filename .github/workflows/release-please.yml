name: Release Please (Reusable)

on:
  workflow_call:
    inputs:
      target_branch:
        required: false
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          target-branch: ${{ inputs.target_branch }}

